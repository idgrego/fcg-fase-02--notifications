# Secret armazena configurações sensíveis
# os dados são armazenados no formato base64
# para converter um texto para base64 pelo terminal:
# Comando: [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("guest"))
# Resultado: Z3Vlc3Q=

apiVersion: v1
kind: Secret
metadata:
  name: notifications-api-secret
  labels:
    app: notifications-api
type: Opaque
data:
  RabbitMQ__Password: Z3Vlc3Q=
